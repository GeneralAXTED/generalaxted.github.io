# Быстрый старт для страниц GitHub

Вы можете использовать GitHub Pages для демонстрации открытый код проектов, размещения блога или даже совместного использования вашего résumé. Это руководство поможет вам приступить к созданию вашего нового веб-сайта.

## Введение

В этом руководстве вы создадите на сайте `<username>.github.io`пользователя.

## Создание веб-сайта

1. В правом верхнем углу любой страницы выберите <svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-plus" aria-label="plus icon" role="img"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"></path></svg>, а затем нажмите кнопку **"Создать репозиторий**".

   ![Снимок экрана: раскрывающееся меню GitHub с параметрами создания новых элементов. Пункт меню "Новый репозиторий" описан в темно-оранжевый.](/assets/images/help/repository/repo-create-global-nav-update.png)
2. Введите `username.github.io` в качестве имени репозитория. Замените `username` на ваш GitHub ник. Например, если имя пользователя — `octocat`, именем репозитория должно быть `octocat.github.io`.

![Снимок экрана: параметры GitHub Pages в репозитории. Поле имени репозитория содержит текст «octocat.github.io» и обведено тёмно-оранжевым цветом.](/assets/images/help/pages/create-repository-name-pages.png)

1. Настройте видимость репозитория. Дополнительные сведения см. в разделе [Сведения о репозиториях](/ru/repositories/creating-and-managing-repositories/about-repositories#about-repository-visibility).
2. Включите параметр **«Добавить файл сведений**».\*\*\*\*
3. Щелкните **Создать репозиторий**.
4. Под именем репозитория щелкните **<svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-gear" aria-label="gear" role="img"><path d="M8 0a8.2 8.2 0 0 1 .701.031C9.444.095 9.99.645 10.16 1.29l.288 1.107c.018.066.079.158.212.224.231.114.454.243.668.386.123.082.233.09.299.071l1.103-.303c.644-.176 1.392.021 1.82.63.27.385.506.792.704 1.218.315.675.111 1.422-.364 1.891l-.814.806c-.049.048-.098.147-.088.294.016.257.016.515 0 .772-.01.147.038.246.088.294l.814.806c.475.469.679 1.216.364 1.891a7.977 7.977 0 0 1-.704 1.217c-.428.61-1.176.807-1.82.63l-1.102-.302c-.067-.019-.177-.011-.3.071a5.909 5.909 0 0 1-.668.386c-.133.066-.194.158-.211.224l-.29 1.106c-.168.646-.715 1.196-1.458 1.26a8.006 8.006 0 0 1-1.402 0c-.743-.064-1.289-.614-1.458-1.26l-.289-1.106c-.018-.066-.079-.158-.212-.224a5.738 5.738 0 0 1-.668-.386c-.123-.082-.233-.09-.299-.071l-1.103.303c-.644.176-1.392-.021-1.82-.63a8.12 8.12 0 0 1-.704-1.218c-.315-.675-.111-1.422.363-1.891l.815-.806c.05-.048.098-.147.088-.294a6.214 6.214 0 0 1 0-.772c.01-.147-.038-.246-.088-.294l-.815-.806C.635 6.045.431 5.298.746 4.623a7.92 7.92 0 0 1 .704-1.217c.428-.61 1.176-.807 1.82-.63l1.102.302c.067.019.177.011.3-.071.214-.143.437-.272.668-.386.133-.066.194-.158.211-.224l.29-1.106C6.009.645 6.556.095 7.299.03 7.53.01 7.764 0 8 0Zm-.571 1.525c-.036.003-.108.036-.137.146l-.289 1.105c-.147.561-.549.967-.998 1.189-.173.086-.34.183-.5.29-.417.278-.97.423-1.529.27l-1.103-.303c-.109-.03-.175.016-.195.045-.22.312-.412.644-.573.99-.014.031-.021.11.059.19l.815.806c.411.406.562.957.53 1.456a4.709 4.709 0 0 0 0 .582c.032.499-.119 1.05-.53 1.456l-.815.806c-.081.08-.073.159-.059.19.162.346.353.677.573.989.02.03.085.076.195.046l1.102-.303c.56-.153 1.113-.008 1.53.27.161.107.328.204.501.29.447.222.85.629.997 1.189l.289 1.105c.029.109.101.143.137.146a6.6 6.6 0 0 0 1.142 0c.036-.003.108-.036.137-.146l.289-1.105c.147-.561.549-.967.998-1.189.173-.086.34-.183.5-.29.417-.278.97-.423 1.529-.27l1.103.303c.109.029.175-.016.195-.045.22-.313.411-.644.573-.99.014-.031.021-.11-.059-.19l-.815-.806c-.411-.406-.562-.957-.53-1.456a4.709 4.709 0 0 0 0-.582c-.032-.499.119-1.05.53-1.456l.815-.806c.081-.08.073-.159.059-.19a6.464 6.464 0 0 0-.573-.989c-.02-.03-.085-.076-.195-.046l-1.102.303c-.56.153-1.113.008-1.53-.27a4.44 4.44 0 0 0-.501-.29c-.447-.222-.85-.629-.997-1.189l-.289-1.105c-.029-.11-.101-.143-.137-.146a6.6 6.6 0 0 0-1.142 0ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM9.5 8a1.5 1.5 0 1 0-3.001.001A1.5 1.5 0 0 0 9.5 8Z"></path></svg> Settings**. Если вкладка "Параметры" не отображается, выберите **раскрывающееся меню <svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-kebab-horizontal" aria-label="More" role="img"><path d="M8 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM1.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm13 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path></svg>** и нажмите кнопку **"Параметры**".

   ![Снимок экрана: заголовок репозитория с вкладками. Вкладка "Параметры" выделена темно-оранжевым контуром.](/assets/images/help/repository/repo-actions-settings.png)
5. В разделе "Код, планирование и автоматизация" "Код и автоматизация" боковой панели щелкните **<svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-browser" aria-label="browser" role="img"><path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25ZM14.5 6h-13v7.25c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25Zm-6-3.5v2h6V2.75a.25.25 0 0 0-.25-.25ZM5 2.5v2h2v-2Zm-3.25 0a.25.25 0 0 0-.25.25V4.5h2v-2Z"></path></svg> Pages**.
6. В разделе "Сборка и развертывание" в пункте "Источник" выберите **Развернуть из ветви**.
7. В разделе "Сборка и развертывание" в разделе "Ветвь" используйте раскрывающееся меню ветви и выберите источник публикации.

![Снимок экрана: параметры страниц в репозитории GitHub . Меню для выбора ветви для источника публикации с меткой "Нет", описано в темно-оранжевый цвет.](/assets/images/help/pages/publishing-source-drop-down.png)

1. При необходимости откройте файл `README.md` репозитория. В файл `README.md` будет записываться содержимое сайта. Вы можете изменить его или пока что сохранить его содержимое.
2. Посетите `username.github.io`, чтобы просмотреть новый веб-сайт. Обратите внимание, что публикация изменений на вашем сайте может занять до 10 минут после того, как вы отправите изменения в GitHub.

## Изменение заголовка и описания

По умолчанию сайт имеет заголовок `username.github.io`. Вы можете изменить заголовок путем изменения файла `_config.yml` в репозитории. Можно также добавить описание вашего сайта.

1. В репозитории нажмите вкладку **Код**.

2. В списке файлов проверьте, существует `_config.yml` ли он. Если его нет, создайте новый файл с именем `_config.yml`.

3. В списке файлов нажмите `_config.yml`, чтобы открыть файл.

4. Нажмите <svg version="1.1" width="16" height="16" viewBox="0 0 16 16" class="octicon octicon-pencil" aria-label="The edit icon" role="img"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.253.253 0 0 0-.064.108l-.558 1.953 1.953-.558a.253.253 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"></path></svg> , чтобы отредактировать файл.

5. Файл `_config.yml` уже содержит строку, в которой указана тема для сайта. Добавьте новую строку с `title:` и нужным заголовком. Добавьте новую строку с `description:` и нужным описанием. Например:

   ```yaml
   theme: jekyll-theme-minimal
   title: Octocat's homepage
   description: Bookmark this to keep an eye on my project updates!
   ```

6. После завершения редактирования файла нажмите кнопку **"Зафиксировать изменения**".

## Дальнейшие действия

Вы успешно создали, персонализированный и опубликовали свой первый GitHub Pages веб-сайт, но есть так многое другое, чтобы изучить! Вот несколько полезных ресурсов, чтобы сделать следующие шаги с GitHub Pages:

* [Добавление контента на ваш сайт GitHub Pages с помощью Jekyll](/ru/pages/setting-up-a-github-pages-site-with-jekyll/adding-content-to-your-github-pages-site-using-jekyll#about-content-in-jekyll-sites): В этом руководстве объясняется, как добавить дополнительные страницы на сайт.

* [Настройка пользовательского домена для вашего сайта GitHub Pages](/ru/pages/configuring-a-custom-domain-for-your-github-pages-site): Вы можете разместить свой сайт на GitHubдомене `github.io` или на собственном пользовательском домене.


…or create a new repository on the command line
echo "# generalaxted.github.io" >> README.md
git init
git add README.md
git commit -m "first commit"
git branch -M main
git remote add origin https://github.com/GeneralAXTED/generalaxted.github.io.git
git push -u origin main
…or push an existing repository from the command line
git remote add origin https://github.com/GeneralAXTED/generalaxted.github.io.git
git branch -M main
git push -u origin main